    workspace_limits: [0.15, 1.75, -1.75, 1.75, 0.30, 1.40]
    arm_max_vel: 0.80
    arm_max_acc: 3.00
    track_kp: [5.0, 5.0, 5.0, 10.0, 10.0, 10.0]
    track_ki: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    track_integral_limit: [0.20, 0.20, 0.20, 0.20, 0.20, 0.20]
